# Client profile — copy this folder to profiles/<client-slug>/ for each new client.
# Produced/updated by /icp-onboarding. Consumed by every downstream skill.

client:
  slug: example-co
  name: Example Co
  website: https://example.com
  onboarded: YYYY-MM-DD

# Which providers this client runs on (multi-provider; see docs/stack-selector.md)
stack:
  source_local: bulk           # bulk | serper | apify
  source_saas: bulk            # bulk | ai_ark | apify
  companies_lookalike: ai_ark  # ai_ark | apify
  scraping: apify              # apify | serper
  contacts: agenticdata        # agenticdata (fallback: ai_ark)
  web_fetch: firecrawl         # firecrawl (+ openwebninja optional)
  storage: supabase            # supabase | csv
  domains: porkbun             # porkbun | dynadot
  inboxes: inboxkit            # inboxkit | maildoso | zapmail
  sending: plusvibe            # plusvibe | smartlead

icp:
  primary_persona: ""          # PIN THIS: the single target title/role per campaign (drives find + persona copy)
  titles: []                   # e.g. ["VP Sales", "Head of Growth"]
  industries: []
  headcount: "10-200"
  geography: ["United States"]
  hard_filters: []
  excluded_industries: []

personalization:
  level: company+persona       # merge-tags | company | company+persona (default variant for broad/lookalike)
  # company-level AI line generated by firecrawl-enrich → {{ai_company_context}}

offer:
  primary_cta: ""              # e.g. "15-min call", "free audit"
  lead_magnet: ""              # from /lead-magnet-brainstorm
  value_prop_category: ""      # make money | save time | save money | mitigate risk
  proof_points: []             # metrics, case studies

infrastructure_status:
  has_inboxes: false
  inboxes_warmed_2wk: false
  keys_present: partial        # yes | partial | no
