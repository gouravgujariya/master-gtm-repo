<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTM Console</title>
<style>
  :root{
    --bg:#eef1f5;--panel:#fff;--panel2:#f7f9fc;--ink:#141a22;--muted:#5a6675;--line:#dce2ea;--lineS:#c4ccd8;
    --accent:#3b60e4;--accentSoft:#e7ecfd;--go:#1f9d5c;--warn:#c58a1a;--stop:#cf4a54;
    --strategy:#b8791b;--data:#0e8c7f;--send:#6a4fd6;--measure:#c0455f;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:"Helvetica Neue",Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  }
  @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161d27;--panel2:#111823;--ink:#e7ecf3;--muted:#93a0b2;--line:#242e3b;--lineS:#33404f;--accent:#7d97ff;--accentSoft:#1b2540;--go:#3fca82;--warn:#e0ad4c;--stop:#ec6b74;--data:#3bb8a6;--send:#a394f0}}
  :root[data-theme="dark"]{--bg:#0d1117;--panel:#161d27;--panel2:#111823;--ink:#e7ecf3;--muted:#93a0b2;--line:#242e3b;--lineS:#33404f;--accent:#7d97ff;--accentSoft:#1b2540;--go:#3fca82;--warn:#e0ad4c;--stop:#ec6b74;--data:#3bb8a6;--send:#a394f0}
  :root[data-theme="light"]{--bg:#eef1f5;--panel:#fff;--panel2:#f7f9fc;--ink:#141a22;--muted:#5a6675;--line:#dce2ea;--lineS:#c4ccd8;--accent:#3b60e4}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
  a{color:var(--accent)}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  .brand{font-weight:800;letter-spacing:-.02em;font-size:18px}
  .brand span{color:var(--accent)}
  header .grow{flex:1}
  select,input,button{font-family:inherit;font-size:13px}
  select,input{background:var(--panel2);color:var(--ink);border:1px solid var(--lineS);border-radius:9px;padding:8px 10px}
  input::placeholder{color:var(--muted)}
  button{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:8px 14px;font-weight:650;cursor:pointer}
  button.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--lineS)}
  button:hover{filter:brightness(1.05)} button:disabled{opacity:.5;cursor:not-allowed}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--go)}
  main{max-width:1240px;margin:0 auto;padding:22px;display:grid;grid-template-columns:1fr;gap:20px}
  .ctxbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .ctxbar label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:4px}
  .stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;border-top:3px solid var(--sc)}
  .stage h3{margin:0 0 3px;font-size:15px;display:flex;align-items:center;gap:8px}
  .stage .num{font-family:var(--mono);font-size:11px;color:var(--sc);font-weight:700}
  .stage p{margin:0 0 12px;color:var(--muted);font-size:12.5px}
  .stage .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .stage .row>*{flex:1;min-width:90px}
  .stage .tool{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px;display:inline-block;margin-bottom:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .card h2{margin:0;padding:13px 16px;font-size:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .card .body{padding:12px 16px;max-height:420px;overflow:auto}
  pre#console{margin:0;padding:14px 16px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto;background:var(--panel2);color:var(--ink)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
  th{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);position:sticky;top:0;background:var(--panel)}
  .pill{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:6px;border:1px solid}
  .pill.ok{color:var(--go);border-color:var(--go)} .pill.no{color:var(--stop);border-color:var(--stop)}
  .tabs{display:flex;gap:6px} .tabs button{padding:5px 11px;font-size:12px}
  .tabs button:not(.on){background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .muted{color:var(--muted)} .mono{font-family:var(--mono)}
  .toggle{cursor:pointer;background:var(--panel2);color:var(--ink);border:1px solid var(--lineS);border-radius:999px;padding:7px 12px;font-family:var(--mono);font-size:12px}
  .status{display:flex;gap:6px;flex-wrap:wrap}
  .k{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:7px;border:1px solid var(--line)}
  .k.on{color:var(--go);border-color:color-mix(in srgb,var(--go) 40%,transparent)} .k.off{color:var(--stop);border-color:color-mix(in srgb,var(--stop) 40%,transparent)}
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:30}
  .login{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:340px;text-align:center}
  .login h1{font-size:20px;margin:0 0 4px}.login p{color:var(--muted);margin:0 0 18px;font-size:13px}
  .login input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--lineS);background:var(--panel2);color:var(--ink);font-size:14px;margin-bottom:10px}
  .login button{width:100%}.err{color:var(--stop);font-size:12.5px;min-height:16px;margin-top:8px}
</style>
</head>
<body>
<div id="gate" style="display:none"><form class="login" onsubmit="doLogin(event)"><h1>GTM Console</h1><p>Enter the team password.</p><input id="pw" type="password" autofocus placeholder="Password"><button type="submit">Enter</button><div class="err" id="lerr"></div></form></div>
<header>
  <div class="brand">GTM<span>·</span>Console</div>
  <label class="mono muted" style="font-size:11px">CLIENT</label>
  <select id="client" onchange="onClient()"></select>
  <button class="ghost" onclick="newClient()">+ New client</button>
  <div class="grow"></div>
  <span id="conn" class="mono muted" style="font-size:12px"><span class="dot"></span> local</span>
  <a href="/workflow" target="_blank" class="mono" style="font-size:12px">workflow ↗</a>
  <button class="toggle" onclick="toggleTheme()">◑</button>
</header>

<main>
  <!-- shared campaign context -->
  <div class="ctxbar">
    <label>CAMPAIGN</label><input id="slug" value="lookalike" size="12" title="campaign slug">
    <label>PERSONA</label><input id="persona" placeholder="Owner" size="12" title="target title">
    <label>SEGMENT</label><input id="segment" placeholder="segment" size="12">
    <label>MARKET</label><input id="market" value="US" size="6">
    <span class="grow"></span>
    <span class="muted mono" style="font-size:12px" id="paths"></span>
  </div>

  <!-- pipeline stages -->
  <div class="stages" id="stages"></div>

  <!-- console + data -->
  <div class="grid2">
    <div class="card">
      <h2>Run output <span class="grow" style="flex:1"></span><span id="jobstat" class="mono muted"></span></h2>
      <pre id="console">Select a client and run a stage. Output streams here.</pre>
    </div>
    <div class="card">
      <h2>Data
        <div class="tabs" style="margin-left:8px"><button id="tabC" class="on" onclick="setTab('contacts')">Contacts</button><button id="tabK" onclick="setTab('companies')">Companies</button></div>
        <span class="grow" style="flex:1"></span><button class="ghost" onclick="loadData()">Refresh</button>
      </h2>
      <div class="body" id="data"><span class="muted">Pick a client to load Supabase data.</span></div>
    </div>
  </div>

  <div class="card">
    <h2>Environment</h2>
    <div class="body"><div class="status" id="env"></div></div>
  </div>
</main>

<script>
const $ = (id)=>document.getElementById(id);
let KEY = sessionStorage.getItem('gtm_app_key')||'';
const hf = (u,o={})=>{ o.headers = Object.assign({'x-app-key':KEY}, o.headers||{}); return fetch(u,o); };
const ctx = ()=>({ client: $('client').value, slug: $('slug').value||'lookalike', persona: $('persona').value, segment: $('segment').value, market: $('market').value });
const paths = (c)=>({
  companies:`profiles/${c.client}/lead-database/companies-${c.slug}.csv`,
  contacts:`profiles/${c.client}/lead-database/contacts-${c.slug}.csv`,
  verified:`profiles/${c.client}/lead-database/contacts-verified-${c.slug}.csv`,
  sequence:`profiles/${c.client}/campaigns/sequence.json`,
});

const STAGES = [
  { n:'01', c:'var(--strategy)', key:'source', title:'Source companies', tool:'ai-ark (lookalike)', desc:'Find lookalike companies via AI Ark from seed domains (the client’s case-study customers). Pushed to Supabase.',
    fields:[['seeds','text','seed domains, comma-separated'],['size','text','40']],
    build:(c,f)=>({cmd:'ai-ark',args:{companies:true,lookalike:f.seeds,size:f.size||40,out:paths(c).companies,push:true,client:c.client,segment:c.segment,market:c.market,source:'ai-ark-lookalike'}}) },
  { n:'02', c:'var(--data)', key:'find', title:'Find decision-makers', tool:'agenticdata-find', desc:'AgenticData (primary) finds contacts + emails per company, persona-first.',
    fields:[['limit','text','40'],['target','text','12']],
    build:(c,f)=>({cmd:'agenticdata-find',args:{in:paths(c).companies,out:paths(c).contacts,title:c.persona,limit:f.limit||40,target:f.target||12}}) },
  { n:'03', c:'var(--send)', key:'verify', title:'Verify emails', tool:'verify-emails', desc:'OptimaVerifier gate (+AI Ark rescue). Pushes verified contacts to Supabase.',
    fields:[],
    build:(c)=>({cmd:'verify-emails',args:{in:paths(c).contacts,out:paths(c).verified,push:true,client:c.client,segment:c.segment,market:c.market,source:'agenticdata'}}) },
  { n:'04', c:'var(--measure)', key:'draft', title:'Draft to Plusvibe', tool:'plusvibe-upload', desc:'Create a DRAFT campaign with up to N verified leads. Never sends.',
    fields:[['max','text','10']],
    build:(c,f)=>({cmd:'plusvibe-upload',args:{leads:paths(c).verified,sequence:paths(c).sequence,max:f.max||10}}) },
];

function renderStages(){
  $('stages').innerHTML = STAGES.map((s,i)=>`
    <div class="stage" style="--sc:${s.c}">
      <h3><span class="num">${s.n}</span> ${s.title}</h3>
      <p>${s.desc}</p>
      <span class="tool">${s.tool}</span>
      <div class="row">${s.fields.map(([k,t,opt])=> t==='select'
        ? `<select id="f-${s.key}-${k}">${opt.map(o=>`<option>${o}</option>`).join('')}</select>`
        : `<input id="f-${s.key}-${k}" placeholder="${opt}">`).join('')}</div>
      <button onclick="runStage(${i})" style="width:100%">Run ${s.title.split(' ')[0].toLowerCase()}</button>
    </div>`).join('');
}
function fieldsOf(s){ const o={}; s.fields.forEach(([k])=>o[k]=($(`f-${s.key}-${k}`)||{}).value||''); return o; }

let polling=null;
async function runStage(i){
  const c=ctx(); if(!c.client){ alert('Pick or create a client first.'); return; }
  const s=STAGES[i]; const {cmd,args}=s.build(c, fieldsOf(s));
  $('console').textContent = `Starting ${s.title}…`;
  const r = await hf('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd,args})}).then(r=>r.json());
  if(r.error){ $('console').textContent = 'Error: '+r.error; return; }
  poll(r.jobId, s.key);
}
function poll(jobId, key){
  clearInterval(polling);
  polling = setInterval(async ()=>{
    const j = await hf('/api/job/'+jobId).then(r=>r.json());
    $('console').textContent = j.output; $('console').scrollTop = $('console').scrollHeight;
    $('jobstat').textContent = j.status;
    if(j.status!=='running'){ clearInterval(polling); if(j.status==='done'){ loadData(); } }
  }, 1200);
}

async function loadClients(sel){
  const cs = await hf('/api/clients').then(r=>r.json());
  $('client').innerHTML = '<option value="">— select client —</option>'+cs.map(c=>`<option value="${c.slug}">${c.name}</option>`).join('');
  if(sel) $('client').value = sel;
}
async function newClient(){
  const name = prompt('New client name (e.g. Acme Co):'); if(!name) return;
  const r = await hf('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd:'new-client',args:{name}})}).then(r=>r.json());
  poll(r.jobId,'new'); setTimeout(()=>loadClients(name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')), 2500);
}
function onClient(){ updatePaths(); loadData(); }
function updatePaths(){ const c=ctx(); $('paths').textContent = c.client ? paths(c).verified : ''; }
['slug','persona','segment','market'].forEach(id=>$(id).addEventListener('input',updatePaths));

let tab='contacts';
function setTab(t){ tab=t; $('tabC').className = t==='contacts'?'on':''; $('tabK').className = t==='companies'?'on':''; loadData(); }
async function loadData(){
  const c=ctx(); if(!c.client){ return; }
  $('data').innerHTML = '<span class="muted">Loading…</span>';
  const rows = await hf(`/api/${tab}?client=${c.client}`).then(r=>r.json());
  if(rows.error){ $('data').innerHTML = `<span class="muted">${rows.error}</span>`; return; }
  if(!rows.length){ $('data').innerHTML = `<span class="muted">No ${tab} yet for ${c.client}. Run the pipeline.</span>`; return; }
  const cols = Object.keys(rows[0]);
  $('data').innerHTML = `<div class="muted mono" style="font-size:11px;margin-bottom:6px">${rows.length} ${tab}</div>`+
    `<table><thead><tr>${cols.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>`+
    rows.map(r=>`<tr>${cols.map(k=>{
      if(k==='sendable') return `<td><span class="pill ${r[k]?'ok':'no'}">${r[k]?'yes':'no'}</span></td>`;
      return `<td title="${(r[k]??'')}">${r[k]??''}</td>`;
    }).join('')}</tr>`).join('')+`</tbody></table>`;
}
async function loadEnv(){
  const s = await hf('/api/status').then(r=>r.json());
  $('env').innerHTML = s.env.map(e=>`<span class="k ${e.present?'on':'off'}">${e.key.replace('_API_KEY','').replace('_KEY','').replace('SUPABASE_SERVICE_ROLE','SUPABASE')} ${e.present?'✓':'—'}</span>`).join('');
}
function toggleTheme(){ const r=document.documentElement; const cur=r.getAttribute('data-theme')|| (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); r.setAttribute('data-theme', cur==='dark'?'light':'dark'); }

async function boot(){ renderStages(); await loadClients(); loadEnv(); }
async function checkAuth(){
  const r = await hf('/api/status');
  if(r.status===401){ $('gate').style.display='flex'; return; }
  $('gate').style.display='none'; boot();
}
async function doLogin(e){
  e.preventDefault(); KEY=$('pw').value; sessionStorage.setItem('gtm_app_key',KEY);
  const r = await hf('/api/status');
  if(r.status===401){ $('lerr').textContent='Wrong password.'; return; }
  $('gate').style.display='none'; boot();
}
checkAuth();
</script>
</body>
</html>
