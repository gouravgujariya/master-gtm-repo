name: CI

# Runs on every push (required for Railway's "Wait for CI") and PR.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gtm
          POSTGRES_PASSWORD: gtm
          POSTGRES_DB: gtm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gtm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://gtm:gtm@localhost:5432/gtm_test
      TEST_DATABASE_URL: postgres://gtm:gtm@localhost:5432/gtm_test
      DEMO_MODE: "on" # never hit paid providers from CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:migrate:deploy
      - run: npm test
